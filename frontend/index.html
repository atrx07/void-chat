<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>void.chat</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="void.chat">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #101010;
      --surface2: #161616;
      --border: #1e1e1e;
      --muted: #333;
      --text: #c8c8c8;
      --dim: #555;
      --c1: #e06c75;
      --c2: #61afef;
      --c3: #98c379;
      --c4: #e5c07b;
      --c5: #c678dd;
      --c6: #56b6c2;
      --c7: #d19a66;
      --c8: #be5046;
      --c9: #7ca3cc;
      --c10: #a8cc8c;
    }

    html { height: 100%; height: -webkit-fill-available; }

    body {
      height: 100%; height: var(--app-height, 100dvh);
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      overflow: hidden;
      position: fixed;
      width: 100%; top: 0; left: 0;
      overscroll-behavior: none;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.012) 2px,rgba(255,255,255,0.012) 4px);
      pointer-events: none; z-index: 9999;
    }

    /* ─── AUTH SCREEN ─────────────────────────────────────────── */
    #auth-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 24px;
    }
    #auth-screen.hidden { display: none; }

    .auth-box {
      width: 100%; max-width: 380px;
    }
    .auth-logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px; font-weight: 600;
      letter-spacing: 0.06em; color: #fff;
      margin-bottom: 4px;
    }
    .auth-logo span { color: var(--dim); font-weight: 400; }
    .auth-tagline {
      font-size: 11px; color: var(--dim);
      letter-spacing: 0.06em; margin-bottom: 40px;
    }

    .auth-tabs {
      display: flex; margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1; padding: 10px 0;
      background: none; border: none;
      color: var(--dim); font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.05em;
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .auth-tab.active { color: #e0e0e0; border-bottom-color: var(--c2); }

    .auth-panel { display: none; }
    .auth-panel.active { display: block; }

    .auth-field { margin-bottom: 16px; }
    .auth-field label {
      display: block; font-size: 10px; color: #666;
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .auth-field input {
      width: 100%; background: #111;
      border: 1px solid var(--border); color: #e0e0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; padding: 12px;
      outline: none; -webkit-appearance: none; border-radius: 0;
      transition: border-color 0.15s;
    }
    .auth-field input:focus { border-color: var(--c2); }

    .auth-btn {
      width: 100%; padding: 12px;
      background: #111; border: 1px solid var(--border);
      color: #e0e0e0; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.06em;
      cursor: pointer; margin-bottom: 10px;
      transition: border-color 0.15s, color 0.15s;
    }
    .auth-btn:hover { border-color: var(--c2); color: var(--c2); }
    .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 16px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .auth-divider span { font-size: 10px; color: var(--dim); letter-spacing: 0.05em; }

    .google-btn {
      width: 100%; padding: 12px;
      background: #111; border: 1px solid var(--border);
      color: #e0e0e0; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.06em;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px;
      transition: border-color 0.15s, color 0.15s;
    }
    .google-btn:hover { border-color: #888; color: #fff; }
    .google-btn svg { flex-shrink: 0; }

    .auth-msg {
      font-size: 11px; padding: 8px 10px;
      margin-top: 10px; border-left: 2px solid var(--dim);
      color: var(--dim); display: none;
    }
    .auth-msg.ok { border-color: var(--c3); color: var(--c3); }
    .auth-msg.err { border-color: var(--c1); color: var(--c1); }

    /* ─── SIDEBAR ─────────────────────────────────────────────── */
    #sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #sidebar-overlay.open { opacity: 1; pointer-events: all; }

    #sidebar {
      position: fixed; top: 0; left: 0;
      width: 300px; height: 100%;
      background: #0d0d0d;
      border-right: 1px solid #2a2a2a;
      z-index: 101;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    #sidebar.open { transform: translateX(0); }

    #sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 20px 16px;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0; background: #0a0a0a;
    }
    #sidebar-header span {
      font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.06em; color: #fff;
    }
    #sidebar-close {
      background: none; border: none; color: var(--dim);
      font-size: 18px; cursor: pointer; padding: 4px; line-height: 1;
    }
    #sidebar-close:hover { color: var(--text); }

    #sidebar-tabs {
      display: flex; border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0; background: #0a0a0a;
    }
    .sidebar-tab {
      flex: 1; padding: 12px 8px;
      background: none; border: none;
      color: #555; font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.05em;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .sidebar-tab.active { color: #e0e0e0; border-bottom-color: var(--c2); }
    .sidebar-tab:hover { color: #e0e0e0; }

    .sidebar-panel { display: none; padding: 20px; flex: 1; }
    .sidebar-panel.active { display: block; }

    .panel-title {
      font-size: 11px; letter-spacing: 0.08em;
      color: #888; text-transform: uppercase; margin-bottom: 16px;
    }
    .panel-msg {
      font-size: 11px; padding: 8px 10px;
      margin-top: 10px; border-left: 2px solid var(--dim); color: var(--dim);
    }
    .panel-msg.ok { border-color: var(--c3); color: var(--c3); }
    .panel-msg.err { border-color: var(--c1); color: var(--c1); }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 10px; color: #666;
      letter-spacing: 0.05em; margin-bottom: 6px; text-transform: uppercase;
    }
    .field input {
      width: 100%; background: #1a1a1a;
      border: 1px solid #2a2a2a; color: #e0e0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px; padding: 10px 12px; outline: none;
      -webkit-appearance: none; border-radius: 0;
    }
    .field input:focus { border-color: var(--c2); }

    .btn {
      width: 100%; padding: 10px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      color: #e0e0e0; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.05em;
      cursor: pointer; transition: border-color 0.15s, color 0.15s; margin-bottom: 10px;
    }
    .btn:hover { border-color: var(--c2); color: var(--c2); }
    .btn-sm { width: auto; padding: 6px 14px; font-size: 11px; margin-bottom: 0; }
    .btn.danger:hover { border-color: var(--c1); color: var(--c1); }
    .btn.success:hover { border-color: var(--c3); color: var(--c3); }

    .divider { height: 1px; background: #2a2a2a; margin: 16px 0; }

    /* user info card */
    #user-card {
      padding: 14px; background: var(--surface2);
      border: 1px solid var(--border); margin-bottom: 16px;
    }
    #user-card-name {
      font-size: 14px; font-weight: 500; margin-bottom: 4px;
    }
    #user-card-email { font-size: 11px; color: var(--dim); }

    /* online tab */
    #online-count-badge {
      display: inline-block; background: var(--c3);
      color: #000; font-size: 10px; font-weight: 600;
      padding: 1px 6px; border-radius: 10px; margin-left: 5px;
    }
    .online-user-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c3); flex-shrink: 0; }

    /* ── User panel sections ───────────────────────────────── */
    .profile-section { margin-bottom: 20px; }
    .profile-section .panel-title { margin-bottom: 10px; }
    .profile-input-row { display: flex; gap: 8px; align-items: stretch; }
    .profile-input-row input { flex: 1; min-width: 0; }
    .profile-input-row .btn-sm {
      flex-shrink: 0; padding: 0 14px;
      font-size: 11px; white-space: nowrap;
    }
    .color-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .color-swatch {
      width: 26px; height: 26px; border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer; transition: transform 0.1s, border-color 0.15s;
      flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.active { border-color: #fff; }
    .color-swatch.auto {
      background: linear-gradient(135deg,
        #e06c75 0%, #61afef 20%, #98c379 40%,
        #e5c07b 60%, #c678dd 80%, #56b6c2 100%);
      position: relative;
    }
    .color-swatch.auto::after {
      content: 'A'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: rgba(0,0,0,0.65);
      font-family: 'JetBrains Mono', monospace;
    }
    .name-preview {
      font-size: 12px; margin-top: 8px;
      padding: 8px 10px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .name-preview span { font-weight: 500; }
    .profile-msg { font-size: 11px; margin-top: 8px; min-height: 14px; letter-spacing: 0.03em; }
    .profile-msg.ok { color: var(--c3); }
    .profile-msg.err { color: var(--c1); }

    /* ── Admin panel ────────────────────────────────────────── */
    #admin-tab { display: none; }
    body.is-admin #admin-tab { display: block; }

    .user-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .user-row .ban-btn {
      background: none; border: 1px solid var(--border); color: var(--dim);
      font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; cursor: pointer;
    }
    .user-row .ban-btn:hover { border-color: var(--c1); color: var(--c1); }
    .banned-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--c1);
    }
    .banned-row .unban-btn {
      background: none; border: 1px solid var(--border); color: var(--dim);
      font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px; cursor: pointer;
    }
    .banned-row .unban-btn:hover { border-color: var(--c3); color: var(--c3); }

    /* sidebar footer */
    #sidebar-footer {
      margin-top: auto; padding: 20px;
      border-top: 1px solid #2a2a2a; flex-shrink: 0;
    }
    #sidebar-author { font-size: 11px; color: #555; letter-spacing: 0.05em; margin-bottom: 14px; }
    #sidebar-author span { color: #888; }
    #sidebar-socials { display: flex; flex-direction: column; gap: 10px; }
    .social-link {
      display: flex; align-items: center; gap: 10px;
      color: #999; text-decoration: none;
      font-size: 12px; letter-spacing: 0.04em;
      padding: 8px 10px; border: 1px solid #222; background: #111;
      transition: color 0.15s, border-color 0.15s;
    }
    .social-link:hover { color: #e0e0e0; border-color: #444; }
    .social-link svg { flex-shrink: 0; opacity: 0.7; }

    /* ─── MAIN CHAT APP ───────────────────────────────────────── */
    #app {
      position: fixed;
      /* top/height are controlled by syncViewportHeight() in JS
         so the app shrinks exactly to the visible area above the keyboard */
      top: 0; left: 0; right: 0;
      height: 100dvh;
      display: flex; flex-direction: column;
      max-width: 720px; margin: 0 auto;
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
      background: var(--bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--bg);
    }
    #hamburger {
      background: none; border: none; color: var(--dim); cursor: pointer;
      padding: 4px 10px 4px 0; font-size: 18px; line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }
    #hamburger:hover { color: var(--text); }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 16px; font-weight: 600;
      letter-spacing: 0.08em; color: #fff;
    }
    header h1 span { color: var(--dim); font-weight: 400; }

    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    #ws-status { font-size: 11px; color: var(--dim); letter-spacing: 0.05em; }
    #ws-status.connected::before { content: '● '; color: var(--c3); }
    #ws-status.reconnecting::before { content: '● '; color: var(--c4); }
    #ws-status.error::before { content: '● '; color: var(--c1); }
    #my-name-display { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }

    /* ─── MESSAGES ────────────────────────────────────────────── */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 12px 16px;
      display: flex; flex-direction: column;
      gap: 0; scroll-behavior: smooth;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    /* ── New message layout ──────────────────────────────────── */
    .msg {
      padding: 6px 0;
      animation: fadeUp 0.18s ease;
      position: relative;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 2px;
    }
    .msg-name {
      font-size: 12px; font-weight: 500;
      flex-shrink: 0;
    }
    .msg-name.is-me::after {
      content: ' ←'; color: var(--dim); font-size: 10px; font-weight: 400;
    }
    .msg-ts {
      font-size: 10px; color: var(--dim);
      letter-spacing: 0.03em;
    }
    .msg-body {
      color: var(--text); font-size: 13px;
      line-height: 1.6; word-break: break-word;
      padding-left: 0;
    }

    /* Admin delete button — shown only for admins on hover */
    .msg-del {
      display: none;
      position: absolute; right: 0; top: 8px;
      background: none; border: none;
      color: var(--c1); font-size: 10px;
      cursor: pointer; padding: 2px 6px;
      opacity: 0.5;
    }
    .msg-del:hover { opacity: 1; }
    body.is-admin .msg:hover .msg-del { display: block; }

    /* Announcement messages */
    .msg.announce {
      background: rgba(229,192,123,0.06);
      border-left: 2px solid var(--c4);
      padding: 8px 10px 8px 14px;
      margin: 6px 0;
    }
    .msg.announce .msg-name { color: var(--c4); }
    .msg.announce .msg-body { color: var(--c4); font-size: 14px; font-weight: 500; }

    /* System messages */
    .msg.system {
      display: flex; justify-content: center;
      padding: 4px 0;
    }
    .msg.system .msg-body {
      color: var(--muted); font-size: 11px;
      font-style: italic; text-align: center;
    }
    .msg.system .msg-header { display: none; }

    /* Consecutive messages from same user — collapse header */
    .msg.same-user .msg-header { display: none; }
    .msg.same-user { padding-top: 1px; }

    #loading {
      display: flex; align-items: center; justify-content: center;
      flex: 1; color: var(--muted); font-size: 12px; letter-spacing: 0.05em;
    }

    /* ─── INPUT BAR ───────────────────────────────────────────── */
    #input-bar {
      position: sticky;
      bottom: 0;
      z-index: 25;
      display: flex; align-items: center;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0; min-height: 56px;
      background: var(--bg);
    }
    #msg-input {
      flex: 1; background: transparent;
      border: none; outline: none;
      color: var(--text); font-family: 'JetBrains Mono', monospace;
      font-size: 16px; caret-color: #fff;
      -webkit-appearance: none; border-radius: 0;
    }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:disabled { opacity: 0.4; }
    #send-btn {
      background: none; border: 1px solid var(--border);
      color: var(--dim); font-family: 'JetBrains Mono', monospace;
      font-size: 12px; letter-spacing: 0.06em;
      padding: 10px 16px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0; min-height: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    #send-btn:hover { border-color: var(--text); color: var(--text); }
    #send-btn:active { opacity: 0.6; }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Typing indicator */
    #typing-bar {
      height: 18px; padding: 0 16px;
      font-size: 10px; color: var(--dim);
      letter-spacing: 0.04em; flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ═══ AUTH SCREEN ════════════════════════════════════════════ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">void<span>.chat</span></div>
    <div class="auth-tagline">sign in to enter the void</div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">login</button>
      <button class="auth-tab" data-tab="register">register</button>
    </div>

    <!-- Login panel -->
    <div class="auth-panel active" id="auth-login">
      <div class="auth-field">
        <label>email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="auth-field">
        <label>password</label>
        <input type="password" id="login-password" placeholder="your password" autocomplete="current-password" />
      </div>
      <button class="auth-btn" id="login-btn">login</button>
      <div class="auth-msg" id="login-msg"></div>

      <div class="auth-divider"><span>or</span></div>
      <button class="google-btn" id="login-google-btn">
        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        continue with google
      </button>
    </div>

    <!-- Register panel -->
    <div class="auth-panel" id="auth-register">
      <div class="auth-field">
        <label>email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="auth-field">
        <label>password</label>
        <input type="password" id="reg-password" placeholder="choose a password (6+ chars)" autocomplete="new-password" />
      </div>
      <div class="auth-field">
        <label>display name</label>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  updateProfile,
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

// ─────────────────────────────────────────────────────────────
// CONFIG — replace with your Firebase project values
// ─────────────────────────────────────────────────────────────
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDnRimJ9Jr-1Osd6cKvo6eBq9l4hHCfcQ8",
  authDomain:        "void-chat-a504a.firebaseapp.com",
  projectId:         "void-chat-a504a",
  storageBucket:     "void-chat-a504a.firebasestorage.app",
  messagingSenderId: "648360027221",
  appId:             "1:648360027221:web:2156072fc184714266e0dc",
};

const API_BASE = 'https://voidchat-atrx.arppithandrewsee.workers.dev'; // your Worker URL

// ─────────────────────────────────────────────────────────────
// Init Firebase
// ─────────────────────────────────────────────────────────────
const app      = initializeApp(FIREBASE_CONFIG);
const auth     = getAuth(app);
const gProvider = new GoogleAuthProvider();

// ─────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)','var(--c9)','var(--c10)'];
function colorForName(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
}
function showAuthMsg(el, text, type) {
  el.textContent = text;
  el.className = 'auth-msg ' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}
function showPanelMsg(el, text, type) {
  el.textContent = text;
  el.className = 'panel-msg ' + type;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3500);
}

// ─────────────────────────────────────────────────────────────
// App state
// ─────────────────────────────────────────────────────────────
let currentUser   = null;   // Firebase user object
let idToken       = null;   // current ID token
let isAdmin       = false;
let ws            = null;   // WebSocket
let wsReady       = false;
let wsReconnectTimer = null;
let lastMsgId     = 0;
let lastSenderId  = null;   // for collapsing consecutive messages
let pollTimer     = null;   // fallback polling interval
let userProfile   = { display_name: null, name_color: null }; // cached profile
let isSending     = false;  // mutex: prevents concurrent sendMessage calls

const messagesEl  = document.getElementById('messages');
const inputEl     = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const wsStatusEl  = document.getElementById('ws-status');
const myNameEl    = document.getElementById('my-name-display');
const loadingEl   = document.getElementById('loading');
const authScreen  = document.getElementById('auth-screen');

// ── Viewport / keyboard layout ───────────────────────────────
// On mobile, when the software keyboard appears the visualViewport
// shrinks. We use that to set the app height AND offset the app
// down by visualViewport.offsetTop so it stays flush under the
// status bar. This is the standard pattern for "keyboard pushes
// chat up, not the whole page" behaviour.
const appEl = document.getElementById('app');

function syncViewportHeight() {
  const vv = window.visualViewport;
  const h  = vv ? vv.height  : window.innerHeight;
  const t  = vv ? vv.offsetTop : 0;
  document.documentElement.style.setProperty('--app-height', h + 'px');
  // Shift the app to start exactly at the viewport top (handles iOS Safari bounce)
  if (appEl) {
    appEl.style.height = h + 'px';
    appEl.style.top    = t + 'px';
  }
}

syncViewportHeight();
window.addEventListener('resize', syncViewportHeight);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    syncViewportHeight();
    // When keyboard closes, scroll back to bottom so last message is visible
    const vv = window.visualViewport;
    const prev = parseFloat(appEl?.style.height || '0');
    requestAnimationFrame(() => {
      if (vv && vv.height > prev) scrollToBottom();
    });
  });
  window.visualViewport.addEventListener('scroll', syncViewportHeight);
}

// ─────────────────────────────────────────────────────────────
// Token management — refresh before expiry
// ─────────────────────────────────────────────────────────────
async function getToken(forceRefresh = false) {
  if (!currentUser) return null;
  idToken = await currentUser.getIdToken(forceRefresh);
  return idToken;
}

// ─────────────────────────────────────────────────────────────
// Auth state observer
// ─────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    await getToken();
    authScreen.classList.add('hidden');
    initChat(user);
  } else {
    authScreen.classList.remove('hidden');
    teardownChat();
  }
});

// ─────────────────────────────────────────────────────────────
// Auth UI — tabs
// ─────────────────────────────────────────────────────────────
document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('auth-' + tab.dataset.tab).classList.add('active');
  });
});

// Login
document.getElementById('login-btn').addEventListener('click', async () => {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const msgEl    = document.getElementById('login-msg');
  if (!email || !password) return showAuthMsg(msgEl, 'fill in all fields', 'err');
  try {
    document.getElementById('login-btn').disabled = true;
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    showAuthMsg(msgEl, firebaseErrMsg(e.code), 'err');
    document.getElementById('login-btn').disabled = false;
  }
});

// Register
document.getElementById('reg-btn').addEventListener('click', async () => {
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const name     = document.getElementById('reg-name').value.trim();
  const msgEl    = document.getElementById('reg-msg');
  if (!email || !password || !name) return showAuthMsg(msgEl, 'fill in all fields', 'err');
  if (name.length < 2) return showAuthMsg(msgEl, 'display name too short', 'err');
  try {
    document.getElementById('reg-btn').disabled = true;
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    // Force token refresh so displayName is in the new token
    await cred.user.getIdToken(true);
  } catch (e) {
    showAuthMsg(msgEl, firebaseErrMsg(e.code), 'err');
    document.getElementById('reg-btn').disabled = false;
  }
});

// Google sign-in (both panels)
async function googleSignIn(msgElId) {
  try {
    await signInWithPopup(auth, gProvider);
  } catch (e) {
    const msgEl = document.getElementById(msgElId);
    if (e.code !== 'auth/popup-closed-by-user') {
      showAuthMsg(msgEl, firebaseErrMsg(e.code), 'err');
    }
  }
}
document.getElementById('login-google-btn').addEventListener('click', () => googleSignIn('login-msg'));
document.getElementById('reg-google-btn').addEventListener('click', () => googleSignIn('reg-msg'));

// Sign out
document.getElementById('logout-btn').addEventListener('click', async () => {
  closeSidebar();
  await signOut(auth);
});

function firebaseErrMsg(code) {
  const map = {
    'auth/invalid-email': 'invalid email address',
    'auth/user-not-found': 'no account with that email',
    'auth/wrong-password': 'incorrect password',
    'auth/email-already-in-use': 'email already registered',
    'auth/weak-password': 'password must be at least 6 characters',
    'auth/too-many-requests': 'too many attempts — try again later',
    'auth/network-request-failed': 'network error',
  };
  return map[code] || 'auth error: ' + code;
}

// ─────────────────────────────────────────────────────────────
// Fallback polling — runs alongside WS, catches anything missed
// ─────────────────────────────────────────────────────────────
async function pollForMessages() {
  if (!currentUser || lastMsgId === 0) return;
  try {
    const token = await getToken(false);
    const res = await fetch(API_BASE + '/api/messages?since=' + lastMsgId, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (!res.ok) return;
    const data = await res.json();
    const msgs = data.messages || [];
    if (!msgs.length) return;
    const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    let appended = false;
    msgs.forEach(m => {
      if (m.id <= lastMsgId) return;
      // Already rendered with real id — dedupe
      if (messagesEl.querySelector('.msg[data-id="' + m.id + '"]')) {
        lastMsgId = m.id;
        return;
      }
      // Already rendered optimistically — swap the id, don't re-append
      if (reconcileOptimistic(m)) {
        lastMsgId = m.id;
        return;
      }
      appendMessage(m);
      lastMsgId = m.id;
      appended = true;
    });
    if (appended && atBottom) scrollToBottom();
  } catch {}
}

function startPolling() {
  stopPolling();
  // Poll every 3 s — cheap enough, only fetches rows newer than lastMsgId
  pollTimer = setInterval(pollForMessages, 3000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ─────────────────────────────────────────────────────────────
// Chat init / teardown
// ─────────────────────────────────────────────────────────────
async function initChat(user) {
  // Fetch saved profile from worker (name override + color)
  try {
    const token = await getToken();
    const res = await fetch(API_BASE + '/api/user/profile', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (res.ok) {
      const data = await res.json();
      userProfile.display_name = data.display_name || null;
      userProfile.name_color   = data.name_color   || null;
    }
  } catch {}

  refreshProfileUI(user);
  initColorSwatches();

  // Load history, then open WebSocket + start polling fallback
  await loadHistory();
  connectWS();
  startPolling();
  checkAdminStatus();

  // Enable input
  inputEl.disabled  = false;
  sendBtn.disabled  = false;
}

function refreshProfileUI(user) {
  const rawName    = user?.displayName || user?.email?.split('@')[0] || 'user';
  const displayName = userProfile.display_name || rawName;
  const color       = userProfile.name_color   || colorForName(displayName);

  // Header
  myNameEl.innerHTML = '<strong style="color:' + color + '">' + escHtml(displayName) + '</strong>';

  // User card in sidebar
  document.getElementById('user-card-name').innerHTML =
    '<span style="color:' + color + '">' + escHtml(displayName) + '</span>';
  document.getElementById('user-card-email').textContent = user?.email || '';

  // Profile name input placeholder
  const nameInput = document.getElementById('profile-name-input');
  if (nameInput) nameInput.value = displayName;

  // Name preview
  const previewEl = document.getElementById('name-preview-text');
  if (previewEl) {
    previewEl.textContent = displayName;
    previewEl.style.color = color;
  }
}

function teardownChat() {
  if (ws) { try { ws.close(); } catch {} ws = null; }
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
  stopPolling();
  messagesEl.innerHTML = '<div id="loading">loading messages...</div>';
  lastMsgId    = 0;
  lastSenderId = null;
  inputEl.disabled = true;
  sendBtn.disabled = true;
  wsStatusEl.textContent = 'connecting...';
  wsStatusEl.className = '';
  document.body.classList.remove('is-admin');
  isAdmin = false;
  userProfile = { display_name: null, name_color: null };
}

// ─────────────────────────────────────────────────────────────
// Load message history via REST
// ─────────────────────────────────────────────────────────────
async function loadHistory() {
  try {
    const token = await getToken();
    const res   = await fetch(API_BASE + '/api/messages?since=0', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const data  = await res.json();
    const el = document.getElementById('loading');
    if (el) el.remove();
    lastSenderId = null;

    if (!data.messages || data.messages.length === 0) {
      appendSystemMsg('no messages yet. say hello.');
    } else {
      data.messages.forEach(m => appendMessage(m));
      lastMsgId = data.messages[data.messages.length - 1].id;
    }
    scrollToBottom();
  } catch (e) {
    const el = document.getElementById('loading');
    if (el) el.textContent = 'failed to load history. reload page.';
  }
}

// ─────────────────────────────────────────────────────────────
// WebSocket connection
// ─────────────────────────────────────────────────────────────
let wsFailCount    = 0;
let wsLastActivity = 0; // timestamp of last ping/pong/message received
let wsWatchdogTimer = null;

// ── Staleness watchdog ────────────────────────────────────────
// If nothing comes from the server in 45 s the connection is silently
// dead (browser throttled it in background). Force a hard reconnect.
const WS_STALE_MS = 45_000;

function resetWatchdog() {
  wsLastActivity = Date.now();
  clearTimeout(wsWatchdogTimer);
  wsWatchdogTimer = setTimeout(() => {
    // Connection has been quiet for too long — tear it down and reconnect.
    if (ws) {
      try { ws.close(); } catch {}
      ws = null;
    }
    wsReady = false;
    if (currentUser) {
      wsStatusEl.textContent = 'reconnecting...';
      wsStatusEl.className = 'reconnecting';
      catchUpAndReconnect();
    }
  }, WS_STALE_MS);
}

function clearWatchdog() {
  clearTimeout(wsWatchdogTimer);
  wsWatchdogTimer = null;
}

// ── Catch-up fetch + reconnect ────────────────────────────────
// Called whenever we know the WS went dark. Fetches any messages
// missed during the silent period before opening a fresh socket.
async function catchUpAndReconnect() {
  if (lastMsgId > 0) {
    try {
      const token = await getToken(false);
      const res = await fetch(API_BASE + '/api/messages?since=' + lastMsgId, {
        headers: { 'Authorization': 'Bearer ' + token },
      });
      if (res.ok) {
        const data = await res.json();
        const msgs = data.messages || [];
        const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
        msgs.forEach(m => {
          if (m.id <= lastMsgId) return;
          // Dedupe: already in DOM with real id
          if (messagesEl.querySelector('.msg[data-id="' + m.id + '"]')) {
            lastMsgId = m.id;
            return;
          }
          // Reconcile optimistic element if present
          if (reconcileOptimistic(m)) {
            lastMsgId = m.id;
            return;
          }
          appendMessage(m);
          lastMsgId = m.id;
        });
        if (msgs.length && atBottom) scrollToBottom();
      }
    } catch {}
  }
  connectWS();
}

async function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    wsStatusEl.textContent = 'connected';
    wsStatusEl.className = 'connected';
    return;
  }
  if (ws && ws.readyState === WebSocket.CONNECTING) return;

  wsStatusEl.textContent = 'connecting...';
  wsStatusEl.className = 'reconnecting';

  try {
    const token = await getToken(wsFailCount > 0);
    const wsUrl = API_BASE.replace(/^http/, 'ws') + '/api/ws?token=' + encodeURIComponent(token);
    ws = new WebSocket(wsUrl);
  } catch (e) {
    scheduleReconnect();
    return;
  }

  ws.addEventListener('open', () => {
    wsReady = true;
    wsFailCount = 0;
    wsStatusEl.textContent = 'connected';
    wsStatusEl.className = 'connected';
    resetWatchdog(); // start staleness timer

    // Heartbeat ping every 20 s — keeps CF alive and resets the watchdog
    ws._pingInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'ping' }));
      }
    }, 20_000);
  });

  ws.addEventListener('message', (event) => {
    resetWatchdog(); // any inbound frame proves the connection is live
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    handleWsMessage(msg);
  });

  ws.addEventListener('close', () => {
    wsReady = false;
    clearInterval(ws?._pingInterval);
    clearWatchdog();
    wsStatusEl.textContent = 'reconnecting...';
    wsStatusEl.className = 'reconnecting';
    scheduleReconnect();
  });

  ws.addEventListener('error', () => {
    wsFailCount++;
    wsStatusEl.textContent = 'error';
    wsStatusEl.className = 'error';
    clearWatchdog();
  });
}

function scheduleReconnect() {
  if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
  const delay = Math.min(1000 * Math.pow(1.5, wsFailCount), 30000);
  wsReconnectTimer = setTimeout(() => {
    if (currentUser) connectWS();
  }, delay);
}

// ── Page-visibility reconnect ─────────────────────────────────
// When the user switches back to this tab (or unlocks their phone),
// check whether the WS is still alive. If it's gone or stale, reconnect
// and fetch any messages that arrived while we were hidden.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !currentUser) return;

  const stale = !ws
    || ws.readyState === WebSocket.CLOSED
    || ws.readyState === WebSocket.CLOSING
    || (wsLastActivity > 0 && Date.now() - wsLastActivity > WS_STALE_MS);

  if (stale) {
    if (ws) { try { ws.close(); } catch {} ws = null; }
    wsReady = false;
    wsStatusEl.textContent = 'reconnecting...';
    wsStatusEl.className = 'reconnecting';
    catchUpAndReconnect();
  }
});

// ─────────────────────────────────────────────────────────────
// Handle incoming WS events
// ─────────────────────────────────────────────────────────────
function handleWsMessage(msg) {
  switch (msg.type) {
    case 'message': {
      if (msg.message.id <= lastMsgId) return;
      const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
      // Dedupe: already rendered via REST poll/history with the real id
      if (messagesEl.querySelector('.msg[data-id="' + msg.message.id + '"]')) {
        lastMsgId = msg.message.id;
        break;
      }
      // If we already rendered this optimistically (temp element), just swap the
      // id and update lastMsgId — don't append a second copy which would hide its header.
      if (reconcileOptimistic(msg.message)) {
        lastMsgId = msg.message.id;
        if (atBottom) scrollToBottom();
        break;
      }
      appendMessage(msg.message);
      lastMsgId = msg.message.id;
      if (atBottom) scrollToBottom();
      break;
    }
    case 'delete': {
      const el = messagesEl.querySelector('.msg[data-id="' + msg.messageId + '"]');
      if (el) { el.remove(); recalcLastSenderId(); }
      break;
    }
    case 'clear': {
      messagesEl.innerHTML = '';
      lastMsgId = 0;
      lastSenderId = null;
      appendSystemMsg('chat cleared by admin.');
      break;
    }
    case 'presence': {
      updateOnlineBadge(msg.onlineCount);
      break;
    }
    case 'pong': resetWatchdog(); break;
  }
}

// ─────────────────────────────────────────────────────────────
// Message rendering — new layout
// ─────────────────────────────────────────────────────────────

// Recalculate lastSenderId by inspecting the actual DOM state.
// Call this after removing any optimistic/temp message so that the next
// real message knows whether to show a name header.
function recalcLastSenderId() {
  // Walk children in reverse; skip system/announce nodes which have no uid
  const children = messagesEl.children;
  for (let i = children.length - 1; i >= 0; i--) {
    const el = children[i];
    if (el.classList.contains('system') || el.classList.contains('announce')) continue;
    lastSenderId = el.dataset.uid || null;
    return;
  }
  lastSenderId = null;
}

// Replace a temp element with the server-confirmed id using the stable clientId.
// Returns true if matched so the caller skips appendMessage (no duplicate).
function reconcileOptimistic(serverMsg) {
  // Only our own messages get optimistic elements
  if (serverMsg.uid !== currentUser?.uid) return false;

  // Primary: match by clientId embedded in the temp element's data-client-id attr
  if (serverMsg.clientId) {
    const el = messagesEl.querySelector('.msg[data-client-id="' + serverMsg.clientId + '"]');
    if (el) {
      el.dataset.id = serverMsg.id;
      return true;
    }
  }

  // Fallback: match by temp-* id prefix (for paths that don't carry clientId back)
  const temps = messagesEl.querySelectorAll('.msg[data-id^="temp-"]');
  for (const el of temps) {
    const bodyEl = el.querySelector('.msg-body');
    if (bodyEl && bodyEl.textContent === serverMsg.message) {
      el.dataset.id = serverMsg.id;
      return true;
    }
  }
  return false;
}

function appendMessage(msg) {
  const isMe      = msg.uid === currentUser?.uid;
  const isAnnounce = msg.type === 'announce';
  const name      = isAnnounce ? 'admin' : msg.display_name;
  const color     = isAnnounce ? 'var(--c4)' : (msg.name_color || colorForName(name));

  const sameUser  = !isAnnounce && lastSenderId === msg.uid;
  lastSenderId    = isAnnounce ? null : msg.uid;

  const div = document.createElement('div');
  div.className = 'msg' +
    (isAnnounce ? ' announce' : '') +
    (isMe && !isAnnounce ? ' is-me' : '') +
    (sameUser ? ' same-user' : '');
  div.dataset.id  = msg.id;
  div.dataset.uid = msg.uid || '';

  div.innerHTML =
    '<div class="msg-header">' +
      '<span class="msg-name' + (isMe && !isAnnounce ? ' is-me' : '') + '" style="color:' + color + '">' + escHtml(name) + '</span>' +
      '<span class="msg-ts">' + formatTime(msg.created_at) + '</span>' +
    '</div>' +
    '<div class="msg-body">' + escHtml(msg.message) + '</div>' +
    (isAdmin ? '<button class="msg-del" data-id="' + msg.id + '">✕</button>' : '');

  div.querySelector('.msg-del')?.addEventListener('click', e => {
    e.stopPropagation();
    adminDeleteMessage(msg.id);
  });

  messagesEl.appendChild(div);
}

function appendSystemMsg(text) {
  lastSenderId = null;
  const div = document.createElement('div');
  div.className = 'msg system';
  div.innerHTML = '<div class="msg-body">' + escHtml(text) + '</div>';
  messagesEl.appendChild(div);
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ─────────────────────────────────────────────────────────────
// Send message
// ─────────────────────────────────────────────────────────────
async function sendMessage() {
  if (isSending) return;                      // prevent double-send on held Enter
  const text = inputEl.value.trim();
  if (!text || !currentUser) return;
  isSending = true;

  // Wipe the field immediately. Setting value='' then blurring+refocusing
  // (which we intentionally avoid) is the main autocomplete trigger — we
  // also set autocomplete=off as a belt-and-suspenders guard.
  inputEl.value = '';
  inputEl.setAttribute('autocomplete', 'off');
  sendBtn.disabled = true;

  const clientId = 'temp-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const optimisticMsg = {
    id: clientId,
    uid: currentUser.uid,
    display_name: userProfile.display_name || currentUser.displayName || currentUser.email?.split('@')[0] || 'user',
    name_color: userProfile.name_color || null,
    message: text,
    created_at: Date.now(),
    type: 'chat',
    clientId,
  };
  appendMessage(optimisticMsg);
  // Stamp the stable clientId on the DOM node for reliable reconciliation
  const tempEl = messagesEl.querySelector('.msg[data-id="' + clientId + '"]');
  if (tempEl) tempEl.dataset.clientId = clientId;
  scrollToBottom();

  let failed = false;
  try {
    const token = await getToken();
    const res   = await fetch(API_BASE + '/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ message: text, clientId }),
    });
    if (res.ok) {
      const data = await res.json();
      const realId = data.message?.id;
      if (realId) {
        // Swap temp id → real id on the optimistic element
        const el = messagesEl.querySelector('.msg[data-client-id="' + clientId + '"]');
        if (el) el.dataset.id = String(realId);
        if (realId > lastMsgId) lastMsgId = realId;
        // Prevent WS echo from duplicating: dedupe guard is data-id which is now the real id
      }
    } else {
      failed = true;
      const d = await res.json();
      const el = messagesEl.querySelector('.msg[data-client-id="' + clientId + '"]');
      if (el) { el.remove(); recalcLastSenderId(); }
      if (d.error === 'You are banned') appendSystemMsg('you have been banned.');
      else inputEl.value = text; // restore text only on real errors
    }
  } catch (e) {
    failed = true;
    const el = messagesEl.querySelector('.msg[data-client-id="' + clientId + '"]');
    if (el) { el.remove(); recalcLastSenderId(); }
    inputEl.value = text;
  }

  isSending = false;
  sendBtn.disabled = false;

  // Only refocus on desktop — on mobile the keyboard stays up naturally.
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (!isTouch) {
    inputEl.focus({ preventScroll: true });
  }
  // Final safety net: clear any text that snuck back in (autocomplete race)
  if (!failed) {
    requestAnimationFrame(() => {
      if (inputEl.value !== '') inputEl.value = '';
    });
  }
}

// Send button handling.
// Android may drop the keyboard when a button steals focus, so touchend handles mobile taps
// and suppresses the follow-up synthetic click. Desktop still uses normal click.
let sendTouchHandledAt = 0;

sendBtn.addEventListener('touchend', e => {
  e.preventDefault();
  sendTouchHandledAt = Date.now();
  // Don't call focus() here — it's the trigger for autocomplete restoring the old value.
  // The keyboard stays up naturally on mobile after sendMessage clears the input.
  sendMessage();
}, { passive: false });

sendBtn.addEventListener('click', e => {
  if (Date.now() - sendTouchHandledAt < 700) return;
  sendMessage();
});

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });

// Sidebar

document.getElementById('hamburger').addEventListener('click', () => {

// ─────────────────────────────────────────────────────────────
// Online list (fetched from DO when sidebar opens)
// ─────────────────────────────────────────────────────────────
async function refreshOnlineList() {
  try {
    const token = await getToken();
    const res   = await fetch(API_BASE + '/api/online', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const data  = await res.json();
    const users = data.users || [];
    updateOnlineBadge(users.length);
    const list = document.getElementById('online-list');
    list.innerHTML = '';
    if (!users.length) {
      list.innerHTML = '<div style="color:var(--dim);font-size:11px">no one online</div>';
      return;
    }
    users.forEach(name => {
      const row = document.createElement('div');
      row.className = 'online-user-row';
      row.innerHTML = '<span class="online-dot"></span><span style="color:' + colorForName(name) + '">' + escHtml(name) + '</span>';
      list.appendChild(row);
    });
  } catch {}
}

// Ping presence every 15s while connected
setInterval(async () => {
  if (!currentUser) return;
  try {
    const token = await getToken();
    await fetch(API_BASE + '/api/online', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
    });
  } catch {}
}, 15000);

function updateOnlineBadge(count) {
  document.getElementById('online-count-badge').textContent = count || 0;
}

// ─────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────
// Profile — color swatches + name change
// ─────────────────────────────────────────────────────────────
const PALETTE = [
  '#e06c75','#61afef','#98c379','#e5c07b','#c678dd',
  '#56b6c2','#d19a66','#be5046','#7ca3cc','#a8cc8c',
];

function initColorSwatches() {
  const container = document.getElementById('color-swatches');
  if (!container || container.dataset.ready) return;
  container.dataset.ready = '1';

  // "Auto" swatch — clears saved color, falls back to hash
  const autoEl = document.createElement('div');
  autoEl.className = 'color-swatch auto' + (!userProfile.name_color ? ' active' : '');
  autoEl.title = 'auto (based on name)';
  autoEl.addEventListener('click', () => selectColor(null));
  container.appendChild(autoEl);

  PALETTE.forEach(hex => {
    const el = document.createElement('div');
    el.className = 'color-swatch' + (userProfile.name_color === hex ? ' active' : '');
    el.style.background = hex;
    el.title = hex;
    el.addEventListener('click', () => selectColor(hex));
    container.appendChild(el);
  });
}

function selectColor(hex) {
  // Update in-memory (not saved yet — save happens with name save or standalone color save)
  userProfile.name_color = hex;

  // Update swatch active states
  document.querySelectorAll('.color-swatch').forEach(el => {
    if (hex === null) {
      el.classList.toggle('active', el.classList.contains('auto'));
    } else {
      el.classList.toggle('active', el.style.background === hex || el.title === hex);
    }
  });

  // Update preview
  const name = document.getElementById('profile-name-input')?.value ||
               userProfile.display_name ||
               currentUser?.displayName || '';
  const color = hex || colorForName(name);
  const previewEl = document.getElementById('name-preview-text');
  if (previewEl) { previewEl.textContent = name; previewEl.style.color = color; }

  // Auto-save color immediately
  saveProfile(null, hex, 'profile-color-msg');
}

async function saveProfile(newName, newColor, msgId) {
  const msgEl = document.getElementById(msgId);
  const name = (newName !== null ? newName : null) ||
               document.getElementById('profile-name-input')?.value.trim() ||
               userProfile.display_name ||
               currentUser?.displayName || 'user';
  const color = newColor !== undefined ? newColor : userProfile.name_color;

  try {
    const token = await getToken();
    const res = await fetch(API_BASE + '/api/user/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ display_name: name, name_color: color }),
    });
    const data = await res.json();
    if (res.ok) {
      userProfile.display_name = data.display_name;
      userProfile.name_color   = data.name_color;
      refreshProfileUI(currentUser);
      if (msgEl) { msgEl.textContent = 'saved'; msgEl.className = 'profile-msg ok'; setTimeout(() => { if(msgEl) msgEl.textContent = ''; }, 2500); }
    } else {
      if (msgEl) { msgEl.textContent = data.error || 'error'; msgEl.className = 'profile-msg err'; }
    }
  } catch (e) {
    if (msgEl) { msgEl.textContent = 'network error'; msgEl.className = 'profile-msg err'; }
  }
}

// Name save button
document.getElementById('profile-name-btn').addEventListener('click', () => {
  const val = document.getElementById('profile-name-input').value.trim();
  if (!val || val.length < 2) {
    const msgEl = document.getElementById('profile-name-msg');
    msgEl.textContent = 'min 2 characters'; msgEl.className = 'profile-msg err';
    return;
  }
  saveProfile(val, undefined, 'profile-name-msg');
});

// Live preview while typing the name
document.getElementById('profile-name-input').addEventListener('input', (e) => {
  const name = e.target.value || userProfile.display_name || currentUser?.displayName || '';
  const color = userProfile.name_color || colorForName(name);
  const previewEl = document.getElementById('name-preview-text');
  if (previewEl) { previewEl.textContent = name; previewEl.style.color = color; }
});

// ─────────────────────────────────────────────────────────────
// Admin — detected by server response on first load
// (ADMIN_UID is set in Worker env; we check by trying an admin call)
// ─────────────────────────────────────────────────────────────
async function checkAdminStatus() {
  try {
    const token = await getToken();
    const res   = await fetch(API_BASE + '/api/admin/users', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (res.ok) {
      isAdmin = true;
      document.body.classList.add('is-admin');
      document.getElementById('admin-tab').style.display = 'block';
    }
  } catch {}
}

// Admin: clear chat
document.getElementById('clear-chat-btn').addEventListener('click', async () => {
  if (!confirm('Clear entire chat? Cannot be undone.')) return;
  const token = await getToken();
  const res   = await fetch(API_BASE + '/api/admin/clear', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token },
  });
  const data  = await res.json();
  const msgEl = document.getElementById('admin-action-msg');
  if (data.ok) showPanelMsg(msgEl, 'chat cleared', 'ok');
  else showPanelMsg(msgEl, data.error || 'error', 'err');
});

// Admin: announce
document.getElementById('announce-btn').addEventListener('click', async () => {
  const message = document.getElementById('announce-input').value.trim();
  const msgEl   = document.getElementById('admin-action-msg');
  if (!message) return showPanelMsg(msgEl, 'enter announcement text', 'err');
  const token = await getToken();
  const res   = await fetch(API_BASE + '/api/announce', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ message }),
  });
  const data  = await res.json();
  if (data.ok) {
    document.getElementById('announce-input').value = '';
    showPanelMsg(msgEl, 'announced!', 'ok');
  } else {
    showPanelMsg(msgEl, data.error || 'error', 'err');
  }
});

// Admin: load users
document.getElementById('load-users-btn').addEventListener('click', async () => {
  const token = await getToken();
  const res   = await fetch(API_BASE + '/api/admin/users', {
    headers: { 'Authorization': 'Bearer ' + token },
  });
  const data  = await res.json();
  const list        = document.getElementById('user-list');
  const bannedList  = document.getElementById('banned-list');
  const bannedSec   = document.getElementById('banned-section');
  list.innerHTML = '';
  bannedList.innerHTML = '';

  const users = data.users || [];
  document.getElementById('users-count').textContent = '(' + users.length + ')';
  users.forEach(u => {
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML =
      '<span style="color:' + colorForName(u.display_name) + '">' + escHtml(u.display_name) + '</span>' +
      '<button class="ban-btn" data-uid="' + escHtml(u.uid) + '">ban</button>';
    row.querySelector('.ban-btn').addEventListener('click', async e => {
      const uid = e.target.dataset.uid;
      const t   = await getToken();
      await fetch(API_BASE + '/api/admin/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
        body: JSON.stringify({ uid }),
      });
      row.remove();
    });
    list.appendChild(row);
  });

  const banned = data.banned || [];
  document.getElementById('banned-count').textContent = '(' + banned.length + ')';
  if (banned.length > 0) {
    bannedSec.style.display = 'block';
    banned.forEach(u => {
      const row = document.createElement('div');
      row.className = 'banned-row';
      row.innerHTML =
        '<span>' + escHtml(u.display_name) + '</span>' +
        '<button class="unban-btn" data-uid="' + escHtml(u.uid) + '">unban</button>';
      row.querySelector('.unban-btn').addEventListener('click', async e => {
        const uid = e.target.dataset.uid;
        const t   = await getToken();
        await fetch(API_BASE + '/api/admin/unban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
          body: JSON.stringify({ uid }),
        });
        row.remove();
      });
      bannedList.appendChild(row);
    });
  } else {
    bannedSec.style.display = 'none';
  }
});

// Admin: delete message
async function adminDeleteMessage(id) {
  const token = await getToken();
  await fetch(API_BASE + '/api/admin/delete-message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ id }),
  });
  // Removal is handled by the WS 'delete' broadcast
}

// (keyboard/viewport handled by syncViewportHeight above)

// Token refresh (Firebase tokens expire after 1h)
setInterval(async () => {
  if (currentUser) await getToken(true);
}, 55 * 60 * 1000);

// ── Periodic WS health check ──────────────────────────────────
// Belt-and-suspenders: every 30 s check the socket is truly open.
// Also corrects any stuck status label (e.g. "reconnecting" stuck on
// desktop when the socket is actually fine).
setInterval(() => {
  if (!currentUser) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    // Socket is healthy — make sure the label reflects that
    if (wsStatusEl.className !== 'connected') {
      wsStatusEl.textContent = 'connected';
      wsStatusEl.className = 'connected';
    }
    return;
  }
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
    wsReady = false;
    catchUpAndReconnect();
  }
}, 30_000);
